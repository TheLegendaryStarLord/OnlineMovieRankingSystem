<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieOpinions</title>
    <link href="../static/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>


<body class="bg-gradient-to-r from-gray-900 to-purple-900">
    <header
        class="site-container grid grid-cols-3 justify-between items-center bg-gray-900 px-3 py-4 text-purple-800 border-b-3 border-purple-900">
        <div>
            <a href="/">
            <h1 class="text-xl font-bold">MovieMinds</h1>
            <i class="text-sm font-semibold">"What did you think of the movie?"</i>
            </a>
        </div>
        <div
            class="col-start-3 container justify-self-end border border-3 border-purple-900 bg-purple-900 rounded-full w-1/2 h-2/3 text-black text-sm grid grid-cols-2 gap-1">
            <a href="/SignUp" class="w-full rounded-l-full">
                <button type="button"
                    class="cols-start-1 cursor-pointer bg-purple-400 hover:bg-purple-900 rounded-l-full w-full h-full">
                    <i class="row-start-2 col-start-2 font-semibold">Sign Up</i>
                </button>
            </a>
            <a href="/SignIn" class="w-full rounded-l-full">
                <button type="button"
                    class="cols-start-2 cursor-pointer bg-purple-400 hover:bg-purple-900 rounded-r-full w-full h-full">
                    <i class="row-start-2 col-start-2 font-semibold">Sign In</i>
                </button>
            </a>
        </div>
    </header>
</body>

</html>
