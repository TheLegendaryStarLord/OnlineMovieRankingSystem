<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieOpinions</title>
    <link href="../static/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body class="bg-gradient-to-r from-gray-900 to-purple-900">
    <header
        class="site-container grid grid-cols-3 justify-between items-center bg-gray-900 px-3 py-4 text-purple-800 border-b-3 border-purple-900">
        <div>
            <a href="/">
                <h1 class="text-xl font-bold">MovieMinds</h1>
                <i class="text-sm font-semibold">"What did you think of the movie?"</i>
            </a>
        </div>
        <div
            class="col-start-3 container justify-self-end border border-3 border-purple-900 bg-purple-900 rounded-full w-1/2 h-2/3 text-black text-sm grid grid-cols-2 gap-1">
            <a href="/SignUp" class="w-full rounded-l-full">
                <button type="button"
                    class="cols-start-1 cursor-pointer bg-purple-400 hover:bg-purple-900 rounded-l-full w-full h-full">
                    <i class="row-start-2 col-start-2 font-semibold">Sign Up</i>
                </button>
            </a>
            <a href="/SignIn" class="w-full rounded-l-full">
                <button type="button"
                    class="cols-start-2 cursor-pointer bg-purple-400 hover:bg-purple-900 rounded-r-full w-full h-full">
                    <i class="row-start-2 col-start-2 font-semibold">Sign In</i>
                </button>
            </a>
        </div>
    </header>

    <div class="flex h-screen items-center justify-center">
        <div class="bg-gray-900 border border-3 rounded border-gray-900 w-1/3 h-1/2 text-center">

            <form action="{{ url_for("login")}}" method="post"
                class=" text-purple-900 font-semibold grid grid-cols-1 h-full justify-center items-center">

                <div class="w-3/4">
                    <label for="login-email" class="block text-xl">Email address</label>
                    <input class="shadow text-lg w-full rounded-full bg-slate-100 py-2 px-3" type="text"
                        name="loginEmail" placeholder="Email@email.com">
                </div>

                <div class="w-3/4">
                    <label for="login-password" class="block text-xl">Password</label>
                    <input class="shadow text-lg w-full rounded-full bg-slate-100 py-2 px-3" type="text"
                        name="loginPassword" placeholder="Password">
                </div>

                <button type="submit"
                    class="cursor-pointer my-4 content-center bg-slate-300 hover:bg-slate-400 grid grid-cols-3 grid-row-3 rounded-full"
                    id="submitButton"><i class="fa fa-user row-start-2 col-start-2 font-semibold"> Sign
                        Up</i>
                </button>

            </form>

        </div>
    </div>

</body>

</html>
